
trigger: none
pr: none

pool:
  vmImage: 'ubuntu-latest'

steps:
  - checkout: self

  - script: |
      echo "Iniciando pré-validação da PR..."
      echo "Repositório: $(Build.Repository.Name)"
      echo "Branch: $(Build.SourceBranch)"

      if [ ! -f "README.md" ]; then
        echo "ERRO: README.md não encontrado!"
        exit 1
      fi

      echo "Pré-validação concluída!"
    displayName: 'Validar estrutura do projeto'
